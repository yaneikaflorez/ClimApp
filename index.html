<!DOCTYPE html>
<html lang="en">
	
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>ClimApp</title>
		<link rel="icon" type="image/x-icon" href="/images/icon.jpg">
		<link rel="stylesheet" href="styles.css" />
		<script src="app.js" defer></script>
	</head>


			
	<body>
		<header>
			<h1 class="title"><img class="weather-icon" src="images/weather-icon.png" alt="weather logo" />ClimApp</h1>
			<div class="get-city">
				<input id="get-city" type="text" placeholder="Buscar ciudad" />
				<button id ="btn-get-city" class="button"> &#x1F50D; </button>
			</div>
			
			
		</header>
		<main>
			<div class="info-container">
				<h3 class="city-name"></h3>
				<p class="coordenate"> </p>
				<h2 class="weather-deg"></h2>
				<h3 class="day-night"></h3>
				<p class="date-info"></p>
				<!-- <div>
					<table id="tabla" class="daily-info"></table>
				</div> -->
				

				<!-- <canvas id="myChart" style="width:100%;max-width:700px;background:white"></canvas> -->
			</div>
		</main>

	</body>
		
		
	
</html>
